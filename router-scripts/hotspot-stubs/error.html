<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MOPDATEC WI-FI - Error</title>
<!--
  Router-served error page. RouterOS shows this for hotspot errors it
  raises outside the login form itself. The wrong-PIN / expired-voucher
  path is handled inline on login.html via its $(if error) block; this is
  the catch-all. No redirect, no backend.
-->
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;color:#0c1f36;
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;
    background:radial-gradient(circle at 50% -10%,#f7fbff,#eaf4fc 70%),#f0f6fc;
  }
  .card{background:#0c1f36;border-radius:18px;padding:28px;max-width:360px;width:100%;
    box-shadow:0 14px 30px rgba(10,25,45,.35);text-align:center;}
  h2{color:#fff;margin:6px 0 10px;font-size:19px;}
  .msg{background:#2a1414;border:1px solid #5c2626;color:#f3b9b9;padding:12px 14px;
    border-radius:10px;font-size:13px;font-weight:600;}
  a.again{display:block;margin-top:18px;padding:11px;border-radius:10px;
    background:linear-gradient(180deg,#3ec9d6,#2ba9b6);color:#04222a;font-weight:800;
    text-decoration:none;font-size:14px;}
  p.sub{color:#9db3c8;font-size:12px;margin-top:14px;}
</style>
</head>
<body>
  <div class="card">
    <h2>Something went wrong</h2>
    <div class="msg">$(error)</div>
    <a class="again" href="$(link-login)">Back to login</a>
    <p class="sub">If this keeps happening, message @Mopdatecwirelessbot for help.</p>
  </div>
</body>
</html>
