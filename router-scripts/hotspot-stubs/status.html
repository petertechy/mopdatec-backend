<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MOPDATEC WI-FI</title>
</head>
<body>
  <script>
    var params = new URLSearchParams({
      username: "$(username)",
      // erase-cookie=on: drop the RouterOS HTTP auth cookie on logout, so a
      // stale cookie can't shadow the PIN form on the next visit once this
      // voucher expires or hits its cap. (PortalStatus also enforces this.)
      linkLogout: "$(link-logout)?erase-cookie=on",
      uptime: "$(uptime)",
      bytesOutNice: "$(bytes-out-nice)",
      bytesInNice: "$(bytes-in-nice)"
    });
    // REPLACE with your deployed Vercel frontend URL.
    window.location.replace("https://mopdatecwifi.com/portal/status?" + params.toString());
  </script>
  <noscript>
    <p>JavaScript is required to view your session. Please enable it and reload this page.</p>
  </noscript>
</body>
</html>
